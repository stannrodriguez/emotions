name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify data, palette, and geometry
        run: npm run verify

  verify-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: npm install && npx playwright install --with-deps chromium
      - name: Verify the rendered app
        run: npm run verify:ui

  deploy:
    needs: [verify, verify-ui]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement lets the first run turn Pages on itself, instead of failing
      # with "Get Pages site failed" until someone flips the repo setting.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # There is no build step: the repo root is the site. Relative paths
      # throughout mean it works from a project subpath as-is.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
